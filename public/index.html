<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>リアルタイム将棋</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    /* 全体でカーソルと文字選択を無効化 */
    * {
      user-select: none;
      /* 文字選択を禁止 */
      -webkit-user-select: none;
      /* Webkitブラウザ用 */
      -moz-user-select: none;
      /* Firefox用 */
      -ms-user-select: none;
      /* IE/Edge用 */
      cursor: default;
      /* デフォルトカーソルに設定 */
    }

    /* ボタンなどはカーソルを指の形にする */
    button {
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      cursor: pointer;
      /* ボタンは指カーソルを許可 */
    }

    /* 入力フィールドでは縦棒カーソルにする */
    input[type="text"],
    input[type="number"] {
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      cursor: text;
      /* 入力フィールドは縦棒カーソルにする */
    }

    /* スクロールを防ぐためのスタイル */
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      /* スクロールを無効化 */
      height: 100%;
      /* 画面全体を占める */
    }

    /* canvasを全画面表示 */
    #shogiCanvas {
      /* タッチ操作でスクロール・ズームさせない（駒のドラッグに使う） */
      touch-action: none;
      display: block;
      /* インライン要素の隙間をなくす */
      width: 100vw;
      /* ビューポートの幅に合わせる */
      height: 100vh;
      /* ビューポートの高さに合わせる */
      background-color: #222222;
      /* 背景色（オプション） */
    }

    .overlay {
      padding: 10px 10px;
      background-color: #222222;
      margin: 10px;
      border-radius: 10px;
      gap: 10px;
      text-align: center;
    }

    /* ---- 共通のUI部品（HTMLのボタン・入力欄・パネル）----
       --u はゲーム内座標の 1 に当たるピクセル数（scene.js で設定）。画面の大きさに合わせて伸縮させる */
    :root {
      --u: 600px;
      --ui-blue: #3241c9;
      --ui-blue-hover: #4152e0;
      --ui-pink: #df398c;
      --ui-pink-hover: #ec4d9c;
      --ui-gray: #4a4a5c;
      --ui-gray-hover: #5a5a6e;
      --ui-panel: rgba(16, 16, 28, 0.82);
      --ui-border: rgba(255, 255, 255, 0.16);
      --ui-text: #ffffff;
      --ui-muted: #c9c9d8;
      --ui-gold: #c2a34f;
    }

    .ubtn {
      background: var(--ui-blue);
      color: var(--ui-text);
      border: none;
      border-radius: 0.4em;
      padding: 0.45em 0.9em;
      font-size: 1em;
      font-family: inherit;
      white-space: nowrap;
      cursor: pointer;
    }

    .ubtn:hover {
      background: var(--ui-blue-hover);
    }

    .ubtn-main {
      background: var(--ui-pink);
      font-size: 1.45em;
      padding: 0.4em 0.9em;
    }

    .ubtn-main:hover {
      background: var(--ui-pink-hover);
    }

    .ubtn-sub {
      background: var(--ui-gray);
    }

    .ubtn-sub:hover {
      background: var(--ui-gray-hover);
    }

    .ubtn.is-open {
      background: var(--ui-blue-hover);
    }

    /* 対局画面などの HTML の文字・ボタン（位置と大きさは ui_html.js が canvas の座標から決める） */
    #gameHUD {
      position: fixed;
      inset: 0;
      font-family: Arial, sans-serif;
      pointer-events: none;
      overflow: hidden;
      z-index: 2;
    }

    #gameHUD>* {
      position: absolute;
      left: 0;
      top: 0;
      box-sizing: border-box;
    }

    .hud-text {
      white-space: pre;
      line-height: 1.1;
      font-weight: bold;
      color: #ffffff;
      /* 縁取り（文字の後ろに影を8方向に重ねる。text-stroke だと文字の上に線が乗って細い文字がつぶれる） */
      --o: var(--outline, #000000);
      text-shadow: 0.06em 0 var(--o), -0.06em 0 var(--o), 0 0.06em var(--o), 0 -0.06em var(--o),
        0.045em 0.045em var(--o), -0.045em 0.045em var(--o), 0.045em -0.045em var(--o), -0.045em -0.045em var(--o);
    }

    .hud-text.no-outline {
      text-shadow: none;
    }

    .hud-text.has-bg {
      padding: 0.2em 0.25em;
      border-radius: 0.2em;
      text-shadow: none;
      font-weight: normal;
    }

    .hud-btn {
      pointer-events: auto;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hud-toggle {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 0.08em 0;
      font-size: calc(var(--h) * 0.2);
      font-family: inherit;
      font-weight: bold;
      color: #ffffff;
      background: #1b1d33e6;
      border: max(2px, 0.12em) solid #8a8aa0;
      border-radius: 0.6em;
      cursor: pointer;
    }

    .hud-toggle.on {
      border-color: #2fbf62;
    }

    .hud-toggle-label {
      line-height: 1.1;
      text-align: center;
      white-space: pre-line;
    }

    .hud-switch {
      position: relative;
      width: 80%;
      height: 1.5em;
      border-radius: 0.75em;
      background: #5a5b70;
    }

    .hud-toggle.on .hud-switch {
      background: #2fbf62;
    }

    .hud-switch-knob {
      position: absolute;
      top: 0.15em;
      left: 0.15em;
      width: 1.2em;
      height: 1.2em;
      border-radius: 50%;
      background: #ffffff;
      transition: left 0.15s;
    }

    .hud-toggle.on .hud-switch-knob {
      left: calc(100% - 1.35em);
    }

    .hud-switch-state {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.7em;
      right: 0.5em;
    }

    .hud-toggle.on .hud-switch-state {
      right: auto;
      left: 0.5em;
    }

    /* 縦画面の上端の帯などは、ほかの文字・ボタンより後ろに置く（要素を作った順に関係なく） */
    .hud-panel {
      z-index: -1;
    }

    .hud-bubble {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.3em 0.4em;
      border-radius: 0.35em;
      color: #ffffff;
      text-align: center;
      /* 行の区切りは ui_character.js が決めている（枠の幅で折り返さない） */
      white-space: pre;
      line-height: 1.1;
    }

    .uinput {
      background: #f0f0f0;
      color: #000000;
      border: none;
      border-radius: 0.4em;
      padding: 0.4em 0.6em;
      font-size: 1em;
      font-family: inherit;
      text-align: center;
      min-width: 0;
      box-sizing: border-box;
      user-select: text;
      -webkit-user-select: text;
    }

    .upanel {
      background: var(--ui-panel);
      border: 1px solid var(--ui-border);
      border-radius: 0.6em;
      color: var(--ui-text);
    }

    /* ---- タイトル画面 ---- */
    #titleUI {
      position: absolute;
      box-sizing: border-box;
      display: grid;
      color: var(--ui-text);
      font-family: sans-serif;
      z-index: 3;
      /* キャラ（Canvas）を置く枠などの空き部分はキャンバスに操作を通す */
      pointer-events: none;
    }

    #titleUI > * {
      pointer-events: auto;
    }

    #titleUI .tui-chara {
      pointer-events: none;
    }

    /* 一番上の列は、音量設定・Discord（画面右上の HTML ボタン）と同じ高さにそろえる。
       --bar-top・--bar-height は scene_title.js で音量設定ボタンの位置から設定する */
    #titleUI.landscape {
      font-size: calc(var(--u) * 0.024);
      padding: var(--bar-top, 8px) calc(var(--u) * 0.03) calc(var(--u) * 0.02);
      grid-template-columns: minmax(0, 1fr) calc(var(--u) * 0.6);
      grid-template-rows: var(--bar-height, auto) auto auto minmax(0, 1fr) auto;
      grid-template-areas:
        "lang     lang"
        "announce announce"
        "logo     logo"
        "chara    panel"
        "charabtn sub";
      column-gap: calc(var(--u) * 0.04);
      row-gap: calc(var(--u) * 0.015);
    }

    /* タッチ端末（スマホ・タブレット）では文字を小さくしすぎない。
       iOS は 16px 未満の入力欄にフォーカスすると画面を拡大するので、入力欄は 16px 以上にする */
    @media (pointer: coarse) {
      #titleUI.landscape {
        font-size: max(11px, calc(var(--u) * 0.024));
      }

      .uinput {
        font-size: max(16px, 1em);
      }
    }

    #titleUI.portrait {
      font-size: max(13px, calc(var(--u) * 0.04));
      padding: var(--bar-top, 8px) 12px 12px;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: var(--bar-height, auto) auto auto minmax(0, 1fr) auto auto auto;
      grid-template-areas:
        "lang"
        "announce"
        "logo"
        "chara"
        "charabtn"
        "panel"
        "sub";
      row-gap: 8px;
    }

    /* 言語は画面の左上（右上の音量設定と左右対称の位置）。--lang-left は scene_title.js で設定する */
    .tui-lang {
      position: absolute;
      left: var(--lang-left, 8px);
      top: var(--bar-top, 8px);
      height: var(--bar-height, auto);
      background: var(--ui-blue);
      color: var(--ui-text);
      border: none;
      border-radius: 0.4em;
      padding: 0.35em 0.5em;
      font-size: var(--bar-font, 0.9em);
      font-family: inherit;
    }

    .tui-announce:empty {
      display: none;
    }

    .tui-announce {
      grid-area: announce;
      align-self: start;
      font-size: 0.9em;
      text-shadow: 0 0 3px #000, 0 0 3px #000;
      white-space: pre-line;
    }

    /* タイトルの文字はキャンバスに描く（元のデザイン）。ここは同じ大きさの場所を取るだけ */
    .tui-logo {
      grid-area: logo;
      margin: 0;
      text-align: center;
      font-weight: bold;
      line-height: 1.1;
      visibility: hidden;
      pointer-events: none;
    }

    #titleUI.landscape .tui-logo {
      font-size: 4.6em;
    }

    #titleUI.portrait .tui-logo {
      font-size: 2.1em;
    }

    .tui-chara {
      grid-area: chara;
    }

    .tui-ranking {
      grid-area: ranking;
      align-self: center;
      padding: 0.5em 0.7em;
    }

    .tui-ranking-title {
      text-align: center;
      font-weight: bold;
      margin-bottom: 0.3em;
    }

    .tui-ranking ol {
      margin: 0;
      padding: 0 0 0 1.6em;
      font-size: 0.9em;
      line-height: 1.45;
    }

    .tui-ranking li {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tui-ranking .rate {
      display: inline-block;
      min-width: 2.6em;
      margin-right: 0.4em;
      color: var(--ui-gold);
      font-variant-numeric: tabular-nums;
    }

    #titleUI.portrait .tui-ranking {
      font-size: 0.8em;
    }

    .tui-panel {
      grid-area: panel;
      align-self: center;
      display: flex;
      flex-direction: column;
      gap: 0.5em;
      padding: 0.8em;
    }

    .tui-play {
      display: flex;
      flex-direction: column;
      gap: 0.5em;
    }

    .tui-status {
      display: flex;
      justify-content: center;
      gap: 1.2em;
      font-size: 0.9em;
      color: var(--ui-muted);
    }

    .tui-levels {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.35em;
    }

    .tui-levels .ubtn {
      padding: 0.4em 0;
    }

    .tui-row {
      display: flex;
      gap: 0.5em;
    }

    /* 入力欄は既定の幅（size 属性ぶん）で枠を押し広げないよう、枠に合わせる */
    .tui-play > .uinput {
      width: 100%;
    }

    .tui-row .uinput {
      flex: 1;
      width: 0;
    }

    .tui-matching {
      display: flex;
      flex-direction: column;
      gap: 0.5em;
    }

    .tui-matching-text {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6em;
      font-size: 1.4em;
      padding: 0.2em 0;
    }

    /* 対局中・マッチング待ちの人数（0人の項目は出さない） */
    .tui-live {
      text-align: center;
      font-size: 0.9em;
      color: var(--ui-muted);
    }

    .tui-live .is-waiting {
      color: #ffd56a;
      font-weight: bold;
    }

    /* ---- マッチング中の表示（タイトル以外の画面）・お知らせ ---- */
    .matching-pill {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 15;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px 6px 12px;
      font-family: sans-serif;
      font-size: 15px;
    }

    .matching-pill[hidden] {
      display: none;
    }

    /* 対局画面（横画面）は、上の列の投了ボタンの右隣（盤より上の空き）に出す。位置はゲーム内座標（--u）で合わせる */
    .matching-pill[data-place="game"] {
      left: calc(50% - var(--u) * 0.72);
      top: calc(50% - var(--u) * 0.49);
      padding: 3px 6px 3px 10px;
      font-size: 13px;
    }

    .matching-pill .ubtn {
      padding: 0.3em 0.7em;
    }

    .notice-toast {
      position: fixed;
      top: 76px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      max-width: calc(100vw - 32px);
      padding: 10px 18px;
      border-radius: 8px;
      background: #2f6f3a;
      border: 1px solid #5fae6c;
      color: #ffffff;
      font-family: sans-serif;
      font-size: 16px;
      text-align: center;
      pointer-events: none;
    }

    .notice-toast[data-kind="error"] {
      background: #b8332b;
      border-color: #e0675f;
    }

    .notice-toast[hidden] {
      display: none;
    }

    @media (orientation: portrait), (max-height: 500px) {
      .matching-pill {
        top: 8px;
        left: 8px;
        font-size: 14px;
      }

      .notice-toast {
        top: 50px;
        font-size: 15px;
      }
    }

    /* 対局画面（縦画面）は、上の帯の下・右上の相手キャラの上に出す（左は相手の駒台があるため） */
    @media (orientation: portrait) {
      .matching-pill[data-place="game"] {
        left: auto;
        right: 8px;
        top: 50px;
      }
    }

    .tui-spinner {
      width: 1em;
      height: 1em;
      border: 0.15em solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: tui-spin 0.9s linear infinite;
    }

    @keyframes tui-spin {
      to {
        transform: rotate(360deg);
      }
    }

    .tui-charabtn {
      grid-area: charabtn;
      /* 横画面はキャラの真下（左からの位置は scene_title.js で合わせる） */
      justify-self: start;
      align-self: end;
    }

    #titleUI.portrait .tui-charabtn {
      justify-self: end;
    }

    .tui-sub {
      grid-area: sub;
      display: flex;
      gap: 0.5em;
      justify-content: flex-end;
      align-self: end;
    }

    #titleUI.portrait .tui-sub {
      justify-content: center;
    }

    #titleUI [hidden] {
      display: none !important;
    }

    /* 入室失敗・接続失敗のお知らせ。パネルのすぐ下に重ねて出す（出ても他の部品は動かない） */
    .tui-panel {
      position: relative;
    }

    .tui-toast {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 0.4em);
      padding: 0.5em 0.8em;
      background: #b8332b;
      border: 1px solid #e0675f;
      border-radius: 0.5em;
      text-align: center;
      font-size: 0.95em;
      pointer-events: none;
      z-index: 1;
    }

    /* ---- キャラ変更の画面 ---- */
    #charaSelectUI {
      position: absolute;
      box-sizing: border-box;
      display: grid;
      color: var(--ui-text);
      font-family: sans-serif;
      z-index: 3;
      /* キャラ（キャンバス）の上は操作をキャンバスに通す */
      pointer-events: none;
    }

    #charaSelectUI > * {
      pointer-events: auto;
    }

    /* 横画面: キャラは左（タイトル画面と同じ位置）、右に見出しとパネル */
    #charaSelectUI.landscape {
      font-size: calc(var(--u) * 0.024);
      padding: var(--bar-top, 8px) calc(var(--u) * 0.03) calc(var(--u) * 0.02);
      grid-template-columns: minmax(0, 1fr) calc(var(--u) * 0.95);
      grid-template-rows: var(--bar-height, auto) minmax(0, 1fr) auto auto minmax(0, 1fr);
      grid-template-areas:
        ".  .    "
        ".  .    "
        ".  title"
        ".  panel"
        ".  .    ";
      row-gap: calc(var(--u) * 0.015);
    }

    /* 縦画面: 見出しはタイトル画面のタイトル文字の位置（top は scene_title.js で設定）、パネルはキャラの下 */
    #charaSelectUI.portrait {
      font-size: max(13px, calc(var(--u) * 0.04));
      padding: var(--bar-top, 8px) 12px 12px;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) auto;
      grid-template-areas:
        "."
        "panel";
    }

    @media (pointer: coarse) {
      #charaSelectUI.landscape {
        font-size: max(11px, calc(var(--u) * 0.024));
      }
    }

    .csel-title {
      grid-area: title;
      margin: 0;
      text-align: center;
      font-size: 2.4em;
      font-weight: bold;
      color: #bbdd44;
      -webkit-text-stroke: 0.06em #000000;
      paint-order: stroke fill;
      text-shadow: 0 0 0.12em #ffffff;
    }

    #charaSelectUI.portrait .csel-title {
      position: absolute;
      left: 0;
      right: 0;
      transform: translateY(-50%);
      font-size: 1.9em;
    }

    .csel-panel {
      grid-area: panel;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.7em;
      padding: 0.9em;
    }

    .csel-faces {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.8em;
    }

    .csel-face {
      background: none;
      border: none;
      padding: 0;
      color: #bbdd44;
      font-family: inherit;
      font-size: 1em;
      text-shadow: 0 0 3px #000000, 0 0 3px #000000;
      cursor: pointer;
    }

    .csel-face img {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      box-sizing: border-box;
      border: 0.18em solid #ffffff;
      border-radius: 0.3em;
      transition: transform 0.1s;
    }

    .csel-face:hover img {
      transform: scale(1.05);
    }

    .csel-face.is-selected img {
      border-color: var(--ui-gold);
      box-shadow: 0 0 0 0.12em var(--ui-gold);
    }

    .csel-face span {
      display: block;
      margin-top: 0.3em;
    }

    .csel-submit {
      font-size: 1.3em;
      padding: 0.35em 1.6em;
    }

    .csel-profile {
      margin: 0;
      width: 100%;
      line-height: 1.5;
      font-size: 0.95em;
      /* キャラを切り替えても枠の高さが変わらないよう、3行ぶんの高さを確保する */
      min-height: 4.5em;
    }

    /* ---- ルール画面（ダイアログ）---- */
    .udialog-backdrop {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      z-index: 20;
      font-family: sans-serif;
      font-size: max(14px, calc(var(--u) * 0.026));
    }

    .udialog-backdrop[hidden] {
      display: none;
    }

    .udialog {
      width: min(calc(var(--u) * 1.2), calc(100vw - 24px));
      max-height: calc(100% - 24px);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 0.8em;
      padding: 1em;
      overflow: hidden;
    }

    .udialog-tabs {
      display: flex;
      gap: 0.4em;
      flex-wrap: wrap;
    }

    .udialog-tabs .ubtn[aria-selected="false"] {
      background: var(--ui-gray);
    }

    .udialog-title {
      margin: 0;
      font-size: 1.4em;
      text-align: center;
    }

    .udialog-body {
      overflow-y: auto;
      white-space: pre-line;
      line-height: 1.6;
      min-height: 0;
    }

    .udialog-footer {
      display: flex;
      justify-content: center;
    }

    .piece-grid {
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      gap: 0.3em;
    }

    .piece-cell {
      background: none;
      border: 1px solid transparent;
      border-radius: 0.3em;
      padding: 0.1em;
      cursor: pointer;
      aspect-ratio: 1;
    }

    .piece-cell.is-selected,
    .piece-cell:hover {
      border-color: var(--ui-gold);
    }

    .piece-cell img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .piece-cell.is-empty {
      visibility: hidden;
    }

    .piece-moves {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1em;
      margin-top: 0.8em;
      white-space: normal;
    }

    .piece-moves-grid {
      display: grid;
      grid-template-columns: repeat(7, 1.6em);
      grid-auto-rows: 1.6em;
      gap: 2px;
      padding: 2px;
      background: #000000;
    }

    .piece-moves-grid div {
      background: #d9a95e;
    }

    .piece-moves-grid div.can {
      background: #6fb8e8;
    }

    .piece-moves-grid img {
      width: 100%;
      height: 100%;
    }

    .blueButton {
      margin: 0px;
      padding: 10px 15px;
      font-size: 28px;
      background-color: #3241c9;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .roomButton {
      margin: 0px;
      padding: 5px 5px;
      font-size: 20px;
      background-color: #3241c9;
      color: white;
      border: none;
      border-radius: 5px;
      width: 290px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .charaButton {
      margin: 0px;
      padding: 10px 15px;
      font-size: 24px;
      background-color: #3241c9;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .whiteText {
      margin: 0px 10px;
      padding: 0px 0px;
      font-size: 24px;
      color: white;
      border-top: -6;
    }

    /* 音量設定UIのスタイル調整 */
    #volumeOverlay {
      /* 対戦履歴の一覧・リプレイの表示より手前に出す */
      z-index: 10;
      padding: 15px 15px;
      /* パディングを小さく */
      margin: 5px;
      /* マージンを小さく */
      display: flex;
      /* 要素を横並びにする */
      flex-direction: column;
      /* 要素を縦並びにする */
      align-items: flex-start;
      /* 左揃え */
      gap: 5px;
      /* 要素間の隙間を小さく */
    }

    #volumeOverlay .whiteText {
      font-size: 16px;
      /* フォントサイズを小さく */
      margin: 0px;
      /* マージンをリセット */
    }

    #volumeOverlay input[type="range"] {
      margin: 0px 5px;
      /* マージンを調整 */
      vertical-align: middle;
      /* 垂直方向中央揃え */
    }

    /* 設定ボタンのスタイル */
    #settingsButton {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px 15px;
      font-size: 20px;
      background-color: #3241c9;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      z-index: 10;
      /* 他の要素より前面に表示 */
    }

    /* コピー成功メッセージのスタイル */
    #copySuccessMessage {
      position: absolute;
      top: 120px;
      /* roomIdOverlayの下に配置 */
      left: 50%;
      transform: translate(0%, 0%);
      background-color: #187a1c;
      /* 緑色の背景 */
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      z-index: 10;
      display: none;
      /* 初期状態では非表示 */
      opacity: 0;
      /* 初期状態では透明 */
      transition: opacity 0.5s ease-in-out;
      /* フェードイン・アウトのアニメーション */
    }

    /* Discordボタンの基本スタイル */
    .discord-button {
      display: inline-block;
      position: absolute;
      top: 20px;
      right: 160px;
      /* 他の要素と横並びできるようにしつつ、大きさも指定可能にする */
      padding: 12px 24px;
      /* ボタンの内側の余白 (上下12px, 左右24px) */
      font-size: 16px;
      /* 文字の大きさ */
      font-weight: bold;
      /* 文字を太字に */
      text-align: center;
      /* 文字を中央揃えに */
      text-decoration: none;
      /* テキストの下線を消す */
      color: #FFFFFF;
      /* 文字の色 (白) */
      background-color: #5865F2;
      /* 背景色 (Discordのブランドカラー) */
      border: none;
      /* 枠線をなくす */
      border-radius: 8px;
      /* ボタンの角を丸くする */
      cursor: pointer;
      /* マウスカーソルを指の形にする */
      transition: background-color 0.3s, transform 0.2s;
      /* 色や形が滑らかに変わるアニメーション */
    }

    /* マウスを乗せた時 (ホバー) のスタイル */
    .discord-button:hover {
      background-color: #4752C4;
      /* 少し暗い色に変化させる */
    }

    /* クリックした時 (アクティブ) のスタイル */
    .discord-button:active {
      transform: translateY(1px);
      /* 少し下に沈むような動き */
    }

    /* 部屋設定表示エリアのスタイル */
    #roomSettingsDisplay {
      position: absolute;
      top: 10px;
      /* tebanOverlayの下に配置 */
      left: 50%;
      transform: translate(-500px, 0px);
      display: none;
      /* 初期状態では表示 */
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
      padding: 10px;
      background-color: #222244;
      border-radius: 10px;
      color: white;
    }

    #roomSettingsDisplay p {
      margin: 0;
      font-size: 18px;
    }

    #roomSettingsDisplay button {
      margin-top: 7px;
      padding: 7px 10px;
      font-size: 18px;
      background-color: #207985;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      align-self: center;
      /* 中央揃え */
    }


    /* 部屋設定オーバーレイのスタイル */
    #roomSettingsOverlay {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, 0%);
      display: none;
      /* 初期状態では非表示 */
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
      padding: 10px;
      background-color: #222244;
      border-radius: 10px;
      color: white;
    }

    #roomSettingsOverlay label {
      font-size: 20px;
    }

    #roomSettingsOverlay input[type="number"] {
      margin-left: 10px;
      padding: 5px;
      border-radius: 5px;
      border: none;
      width: 80px;
    }

    #roomSettingsOverlay button {
      margin-top: 10px;
      padding: 7px 10px;
      font-size: 20px;
      background-color: #207985;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      align-self: center;
      /* 中央揃え */
    }

    /* 適用・閉じるボタンを中央に横並び */
    #roomSettingsButtons {
      display: flex;
      gap: 10px;
      align-self: center;
    }

    #roomSettingsOverlay #closeRoomSettingsButton {
      background-color: #555577;
    }

    /* ===== スマートフォン対応 ===== */
    html,
    body {
      /* ダブルタップ拡大・引っ張り更新・長押しメニュー・タップ時の青いハイライトを無効化 */
      touch-action: manipulation;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }

    /* 縦画面・小さい横画面で共通: HTMLボタンを小さくする */
    @media (orientation: portrait), (max-height: 500px) {
      #settingsButton {
        top: 8px;
        right: 8px;
        padding: 8px 10px;
        font-size: 14px;
      }

      .discord-button {
        top: 8px;
        right: 96px;
        padding: 8px 12px;
        font-size: 14px;
      }

      #volumeOverlay {
        top: 44px !important;
      }

      #displayRoomIdButton,
      #copyIdButton {
        width: auto !important;
        height: 40px !important;
        padding: 0 12px !important;
        font-size: 18px !important;
      }

      #roomIdStr {
        font-size: 28px !important;
        white-space: nowrap;
      }

      .roomButton {
        width: auto;
        padding: 8px 14px;
        font-size: 16px;
      }

      #playingText p {
        font-size: 24px;
      }

      #roomSettingsDisplay {
        top: 8px;
        left: 8px;
        transform: none;
      }

      #roomSettingsDisplay p,
      #roomSettingsDisplay button,
      #roomSettingsOverlay label,
      #roomSettingsOverlay button {
        font-size: 14px;
      }

      #senteOverlay,
      #goteOverlay,
      #spectatorsOverlay {
        width: 200px !important;
      }

      #tebanOverlay p {
        margin: 6px 0;
        font-size: 14px;
        word-break: break-all;
      }

      .whiteText {
        font-size: 18px;
      }

      .blueButton {
        font-size: 22px;
      }

      #resultOverlay,
      #roomResultOverlay {
        max-width: calc(100vw - 40px);
      }
    }

    /* 縦画面: ルーム画面の要素を上から順に縦に積む。
       人数が増えて一覧が伸びても部屋設定・退室と重ならず、入りきらなければスクロールする */
    @media (orientation: portrait) {
      body.room-active #roomui {
        position: fixed;
        top: 52px;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 0 8px 16px;
        box-sizing: border-box;
        overflow-y: auto;
      }

      /* 各要素の絶対配置（インラインの top/left/transform）を解除して上から順に並べる */
      body.room-active #roomui > .overlay:not(#roomSettingsOverlay),
      body.room-active #roomActionRow > .overlay {
        position: static !important;
        top: auto !important;
        left: auto !important;
        bottom: auto !important;
        transform: none !important;
        margin: 0 !important;
        flex-shrink: 0;
      }

      /* 準備完了（またはキャンセル）とゲーム開始を横並びにする。
         ボタンの有無やプレイ中表示で高さが変わらないよう、ボタン1段分（60px）の高さを常に確保する */
      body.room-active #roomActionRow {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
        height: 60px;
      }

      body.room-active #playingText p {
        margin: 0;
      }

      #roomIdOverlay {
        flex-wrap: nowrap;
        justify-content: center;
        align-items: center;
        max-width: 100%;
        box-sizing: border-box;
      }

      #copySuccessMessage {
        top: 70px;
        left: 50%;
        transform: translate(-50%, 0);
        white-space: nowrap;
      }

      #tebanOverlay {
        width: 100%;
        box-sizing: border-box;
        padding: 0;
        gap: 6px;
      }

      #senteOverlay,
      #goteOverlay,
      #spectatorsOverlay {
        width: auto !important;
        flex: 1 1 0;
        min-width: 0;
        margin: 0;
        padding: 6px;
      }

      #tebanOverlay .roomButton {
        width: 100%;
        padding: 8px 4px;
        font-size: 15px;
        white-space: normal;
      }

      /* 余白があるときは部屋設定と退室を下端に寄せる（人数が多いときは一覧の下に続く） */
      body.room-active #roomui > #roomSettingsDisplay.overlay {
        margin-top: auto !important;
      }

      /* 部屋設定の変更画面は一覧の上に重ねて表示する */
      #roomSettingsOverlay {
        top: 20%;
        margin: 0;
        z-index: 20;
      }
    }
    /* ---- 対戦履歴（一覧） ---- */
    #historyPanel {
      position: absolute;
      top: 70px;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: min(820px, calc(100vw - 24px));
      box-sizing: border-box;
      flex-direction: column;
      background: rgba(24, 24, 32, 0.94);
      border-radius: 12px;
      color: #ffffff;
      font-family: sans-serif;
      overflow: hidden;
      z-index: 5;
    }

    .hheader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 4px;
    }

    .hheader-title {
      font-size: 24px;
      font-weight: bold;
    }

    .hcrumbs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      padding: 4px 16px;
      font-size: 16px;
    }

    .hcrumb {
      background: none;
      border: none;
      color: #8fb4ff;
      font-size: 16px;
      padding: 2px 4px;
      text-decoration: underline;
    }

    .hcrumb-current {
      padding: 2px 4px;
      font-weight: bold;
    }

    .hcrumb-sep {
      color: #888888;
    }

    .htoolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 6px 16px 10px;
      border-bottom: 1px solid #ffffff22;
    }

    .hnote {
      font-size: 14px;
      color: #bbbbbb;
    }

    .hlist {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }

    .hrow {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid #ffffff14;
      cursor: pointer;
    }

    .hrow:hover {
      background: #ffffff0d;
    }

    .hrow * {
      cursor: pointer;
    }

    .hrow-body {
      flex: 1;
      min-width: 0;
    }

    .hrow-title {
      font-size: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hrow-meta {
      font-size: 13px;
      color: #bbbbbb;
      margin-top: 2px;
    }

    .hrow-saved {
      font-size: 13px;
      color: #9fc4ff;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hfolder-icon {
      font-size: 26px;
      width: 48px;
      text-align: center;
      flex-shrink: 0;
    }

    .hbadge {
      width: 48px;
      flex-shrink: 0;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      padding: 6px 0;
      border-radius: 6px;
    }

    .hbadge-win {
      background: #c8453a;
    }

    .hbadge-lose {
      background: #3a5fc8;
    }

    .hbadge-draw {
      background: #666666;
    }

    .hempty {
      padding: 24px;
      text-align: center;
      color: #999999;
    }

    .hbtn {
      background: #3241c9;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 16px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .hbtn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .hbtn-sub {
      background: #555566;
    }

    .hbtn-danger {
      background: #b8332b;
    }

    .hbtn-play {
      background: #df398c;
    }

    .hbtn-more {
      background: #444455;
      padding: 8px 12px;
    }

    .hmodal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
    }

    .hmodal {
      width: min(420px, calc(100vw - 32px));
      max-height: calc(100vh - 64px);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 18px;
      background: #262633;
      border-radius: 12px;
      color: #ffffff;
      font-family: sans-serif;
    }

    .hmodal-title {
      font-size: 18px;
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hmodal-message {
      font-size: 16px;
      line-height: 1.5;
    }

    .hmodal-error {
      font-size: 14px;
      color: #ff8a80;
      min-height: 1em;
    }

    .hmodal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .hmenu-item {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
    }

    .hinput {
      font-size: 16px;
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      user-select: text;
      -webkit-user-select: text;
    }

    .hpicker {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hpicker-item {
      background: #33334a;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 16px;
      text-align: left;
    }

    .hpicker-item:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* ---- リプレイ ---- */
    .replay-info {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      /* 左上の「マッチング中」と右上の音量設定ボタンにかからない幅にする */
      max-width: calc(100vw - 420px);
      padding: 6px 14px;
      background: rgba(20, 20, 28, 0.85);
      border-radius: 10px;
      color: #ffffff;
      font-family: sans-serif;
      text-align: center;
      z-index: 5;
    }

    .replay-players {
      font-size: 17px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 10px;
    }

    .replay-vs {
      color: #aaaaaa;
    }

    .replay-detail {
      font-size: 13px;
      color: #cccccc;
      margin-top: 2px;
    }

    .replay-controls {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: min(760px, calc(100vw - 16px));
      box-sizing: border-box;
      padding: 8px 12px;
      background: rgba(20, 20, 28, 0.85);
      border-radius: 10px;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 5;
    }

    .replay-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .replay-seek {
      flex: 1;
      min-width: 0;
    }

    .replay-time {
      font-size: 14px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .replay-btn {
      min-width: 44px;
      padding: 6px 10px;
    }

    .replay-speed {
      min-width: 56px;
    }

    .replay-back {
      margin-left: auto;
    }

    /* 音量設定ボタンが小さくなる画面では一覧をその下から始める */
    @media (orientation: portrait), (max-height: 500px) {
      #historyPanel {
        top: 48px;
        bottom: 8px;
      }
    }

    /* 横画面では再生操作を1行にまとめ、盤の高さを確保する */
    @media (orientation: landscape) {
      .replay-controls {
        flex-direction: row;
        align-items: center;
        width: min(1100px, calc(100vw - 16px));
      }

      .replay-controls .replay-row:first-child {
        flex: 1;
        min-width: 0;
      }
    }

    /* 縦画面では対局者表示を音量設定ボタンの下に置く */
    @media (orientation: portrait) {
      .replay-row {
        gap: 6px;
      }

      .replay-btn {
        min-width: 36px;
        padding: 6px 8px;
      }

      .replay-speed {
        min-width: 44px;
      }

      .replay-info {
        top: 64px;
        max-width: calc(100vw - 24px);
        width: max-content;
      }
    }
  </style>
</head>

<body>
  <!-- ロード中テキスト表示用の要素 -->
  <div id="loadingOverlay" class="overlay"
    style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; justify-content: center; align-items: center;">
    <p id="loadingText" style="color: white; font-size: 48px;">Loading...</p>
  </div>

  <canvas id="shogiCanvas" tabindex="0"></canvas>
  <!-- 対局画面などの文字・ボタン（canvas の UI と同じ座標に HTML で出す。ui_html.js） -->
  <div id="gameHUD"></div>

  <!-- タイトル画面（背景とキャラはキャンバス、それ以外はここ） -->
  <div id="titleUI" class="landscape" style="display: none;">
    <select id="titleLanguage" class="tui-lang" aria-label="Language"></select>
    <div id="titleAnnounce" class="tui-announce"></div>
    <h1 id="titleLogo" class="tui-logo"></h1>
    <div id="titleCharaArea" class="tui-chara"></div>
    <!-- ランキングはいったん表示しない（中身は scene_title.js の updateRanking で作り続ける） -->
    <div id="titleRanking" class="tui-ranking upanel" hidden>
      <div id="titleRankingTitle" class="tui-ranking-title"></div>
      <ol id="titleRankingList"></ol>
    </div>
    <div id="titlePanel" class="tui-panel upanel">
      <div id="titlePlay" class="tui-play">
        <input type="text" id="nameInput" class="uinput" autocomplete="off" placeholder="名前" maxlength="12">
        <div class="tui-status"><span id="titleGameCount"></span><span id="titleRating"></span></div>
        <div id="titleLive" class="tui-live" hidden></div>
        <button id="onlineMatchButton" class="ubtn ubtn-main"></button>
        <button id="cpuMatchButton" class="ubtn" aria-expanded="false"></button>
        <div id="cpuLevels" class="tui-levels" hidden></div>
        <div class="tui-row">
          <input type="text" id="roomIdInput" class="uinput" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="部屋ID" maxlength="6">
          <button id="joinRoomButton" class="ubtn"></button>
        </div>
        <button id="makeRoomButton" class="ubtn"></button>
      </div>
      <div id="titleMatching" class="tui-matching" hidden>
        <div class="tui-matching-text"><span class="tui-spinner"></span><span id="matchingText"></span></div>
        <div id="matchingLive" class="tui-live" hidden></div>
        <button id="matchingCpuButton" class="ubtn" aria-expanded="false"></button>
        <div id="matchingCpuLevels" class="tui-levels" hidden></div>
        <button id="matchingHistoryButton" class="ubtn"></button>
        <button id="cancelMatchButton" class="ubtn ubtn-sub"></button>
      </div>
      <div id="titleToast" class="tui-toast" role="alert" hidden></div>
    </div>
    <button id="changeCharaButton" class="ubtn tui-charabtn"></button>
    <div class="tui-sub">
      <button id="historyButton" class="ubtn ubtn-sub"></button>
      <button id="ruleButton" class="ubtn ubtn-sub"></button>
    </div>
  </div>

  <!-- キャラ変更の画面（背景とキャラはキャンバス、それ以外はここ） -->
  <div id="charaSelectUI" class="landscape" style="display: none;">
    <h2 id="charaSelectTitle" class="csel-title"></h2>
    <div class="csel-panel upanel">
      <div id="charaSelectFaces" class="csel-faces"></div>
      <button id="charaSelectSubmit" class="ubtn csel-submit"></button>
      <p id="charaSelectProfile" class="csel-profile"></p>
    </div>
  </div>

  <!-- マッチング中に CPU 戦・対戦履歴の画面へ移ったときの表示 -->
  <div id="matchingPill" class="matching-pill upanel" data-place="corner" hidden>
    <span class="tui-spinner"></span><span id="matchingPillText"></span>
    <button id="matchingPillStop" class="ubtn ubtn-sub"></button>
  </div>
  <div id="noticeToast" class="notice-toast" role="status" hidden></div>

  <!-- ルール画面 -->
  <div id="ruleDialog" class="udialog-backdrop" hidden>
    <div class="udialog upanel" role="dialog" aria-modal="true" aria-labelledby="ruleTitle">
      <div class="udialog-tabs" role="tablist">
        <button id="ruleTabPieces" class="ubtn" role="tab"></button>
        <button id="ruleTabManual" class="ubtn" role="tab"></button>
        <button id="ruleTabWin" class="ubtn" role="tab"></button>
      </div>
      <h2 id="ruleTitle" class="udialog-title"></h2>
      <div id="ruleBody" class="udialog-body"></div>
      <div class="udialog-footer"><button id="ruleCloseButton" class="ubtn ubtn-sub"></button></div>
    </div>
  </div>
  <button id="charaSubmitButton" class="blueButton"
    style="display: none; position: absolute; bottom: 21%; left: 70%;  font-size: 40px; padding:10px 15px; border-radius: 10px; transform: translate(-50%, -50%);">決定</button>
  </div>


  <div id="roomui">
    <div id="roomIdOverlay" class="overlay"
      style="position: absolute; top:50px; left:40%; display: none; transform: translate(0%, 0%);">
      <button id="displayRoomIdButton" class="roomButton"
        style="padding: 0px; height:60px; margin: 0px;background-color: #207985; font-size:32px">部屋IDを表示</button>
      <p id="roomIdStr" style="padding: 0px; margin: 0px; color: #ffffff; font-size:48px"></p>
      <button id="copyIdButton" class="roomButton"
        style="padding: 0px; width: 150px; height:60px; margin: 0px;background-color: #37792e; font-size:36px">コピー</button>
    </div>

    <!-- コピー成功メッセージ -->
    <div id="copySuccessMessage">部屋IDをコピーしました！</div>

    <!-- プレイ中表示と準備完了/キャンセル/ゲーム開始（横画面ではそれぞれ絶対配置、
         縦画面ではこの行に横並び。行の高さは固定で、表示の有無で下の一覧が動かない） -->
    <div id="roomActionRow">
      <div id="playingText" class="overlay"
        style="position: absolute; top:120px; left:50%; background-color: #00000000; display: none; transform: translate(-50%, 0%);">
        <p style="color: #d43737; font-size: 36px;">プレイ中</p>
      </div>

      <div id="readyOverlay" class="overlay"
        style="position: absolute; top:150px; left:50%; display: none; transform: translate(-50%, 0%);">
        <button id="readyButton" class="roomButton" style="background-color: #c06109;">準備完了</button>
      </div>

      <div id="cancelOverlay" class="overlay"
        style="position: absolute; top:150px; left:50%; display: none; transform: translate(-50%, 0%);">
        <button id="cancelButton" class="roomButton" style="background-color: #37792e;">キャンセル</button>
      </div>

      <div id="startOverlay" class="overlay"
        style="position: absolute; top:150px; left:50%; display: none; transform: translate(60%, 0%);">
        <button id="startRoomGameButton" class="roomButton" style="background-color: #d842bf;">ゲーム開始</button>
      </div>
    </div>



    <div id="tebanOverlay" class="overlay"
      style="display: none; position: absolute; top:200px; left:50%;  background-color: #00000000;  transform: translate(-50%, 0%);">

      <div id="senteOverlay" class="overlay" style="display: block; width: 300px;">
        <button id="moveToSenteButton" class="roomButton">先手に移動</button>
      </div>
      <div id="spectatorsOverlay" class="overlay" style="display: block; width: 300px;">
        <button id="moveToSpectatorsButton" class="roomButton">観戦</button>
      </div>
      <div id="goteOverlay" class="overlay" style="display: block; width: 300px;">
        <button id="moveToGoteButton" class="roomButton">後手に移動</button>
      </div>
    </div>

    <!-- 部屋設定表示エリアを追加 -->
    <div id="roomSettingsDisplay" class="overlay">
      <p id="maxPlayersDisplay"></p>
      <p id="senteMoveTimeDisplay"></p>
      <p id="goteMoveTimeDisplay"></p>
      <!-- オーナーの場合のみ表示されるボタン -->
      <button id="openRoomSettingsButton" style="display: none;">ルーム設定変更</button>
    </div>

    <!-- 部屋設定オーバーレイ (変更なし) -->
    <div id="roomSettingsOverlay" class="overlay">
      <label for="maxPlayersInput">最大プレイヤー数:</label>
      <input type="number" id="maxPlayersInput" min="2" max="12" value="2">

      <label for="senteMoveTimeInput">先手クールダウン (秒):</label>
      <input type="number" id="senteMoveTimeInput" min="0" max="30" value="5">

      <label for="goteMoveTimeInput">後手クールダウン (秒):</label>
      <input type="number" id="goteMoveTimeInput" min="0" max="30" value="5">

      <div id="roomSettingsButtons">
        <button id="saveRoomSettingsButton">適用</button>
        <button id="closeRoomSettingsButton">閉じる</button>
      </div>
    </div>

    <div id="leaveRoomOverlay" class="overlay"
      style="position: absolute; bottom:20px; left:50%; display: none; transform: translate(-50%, 0%);">
      <button id="leaveRoomButton" class="roomButton" style="width:120px;">退室</button>
    </div>
  </div>

  <div id="charaSelectOverlay" class="overlay"
    style="display: none; position: absolute; bottom: 120px;  left: 20px; transform: translate(0%, 0%);">
    <button id="charaSelectButton" class="charaButton">キャラ変更</button>
  </div>
  <div id="resultOverlay" class="overlay"
    style="display: none; position: absolute; top: 70%; left: 50%; transform: translate(-50%, -50%);">
    <p id="winCon" class="whiteText">試合終了</p>
    <p id="changeRating" class="whiteText">レート変動 なし</p>
    <button id="toTitleButton" class="blueButton">タイトルに戻る</button>
  </div>
  <div id="roomResultOverlay" class="overlay"
    style="display: none; position: absolute; top: 70%; left: 50%; transform: translate(-50%, -50%);">
    <p id="roomWinCon" class="whiteText">試合終了</p>
    <button id="toRoomButton" class="blueButton">戻る</button>
  </div>

  <!-- 設定ボタンを追加 -->
  <button id="settingsButton">音量設定</button>

  <div id="volumeOverlay" class="overlay"
    style="display: none;  margin:10px; position: absolute; top: 60px; right: 10px; text-align: left;">
    <label for="bgmVolumeSlider" class="whiteText">BGM:</label>
    <input type="range" id="bgmVolumeSlider" min="0" max="100" value="100">
    <label for="soundVolumeSlider" class="whiteText">SE:</label>
    <input type="range" id="soundVolumeSlider" min="0" max="100" value="100">
    <label for="voiceVolumeSlider" class="whiteText">Voice:</label>
    <input type="range" id="voiceVolumeSlider" min="0" max="100" value="100">
  </div>
  <a id="discordButton" href="https://discord.gg/6VYVWnM7Qu" class="discord-button" target="_blank"
    rel="noopener noreferrer">
    Discord
  </a>


  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="./main.js" type="module"></script>
</body>

</html>
